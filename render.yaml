services:
  - type: web
    name: guardrail-server
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: covenant-axl-node
    env: docker
    dockerfilePath: axl/containerfiles/Dockerfile
    dockerContext: axl
    plan: free
    envVars:
      - key: PORT
        value: 9002
