server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS: resolve `api` when each request runs (nginx resolves static
    # upstream names at startup otherwise, and `api` may not exist yet → crash loop).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $covenant_api api:3000;
        proxy_pass http://$covenant_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
