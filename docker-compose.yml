# Host ports (override when busy):
#   COVENANT_API_PORT=3001 docker compose up -d   — if 3000 is taken (local node server).
#   COVENANT_WEB_PORT=8081 docker compose up -d  — if 8080 is taken (another app/container).
services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${COVENANT_API_PORT:-3000}:3000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
    volumes:
      - covenant_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "${COVENANT_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  covenant_data: {}
